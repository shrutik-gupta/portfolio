<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#180c0f" />
    <meta name="description" content="Shrutik Gupta — software developer in Mumbai. I build AI-powered products, web apps and the back ends behind them." />
    <link rel="icon" href="/src/assets/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Shrutik Gupta — I build websites &amp; apps</title>

    <!-- Resolve the theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.backgroundColor = theme === 'light' ? '#efe7d6' : '#180c0f';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
